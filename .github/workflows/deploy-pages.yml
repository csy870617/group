name: Deploy to GitHub Pages

# 정적 사이트(루트의 index.html 등)를 GitHub Pages 로 배포합니다.
# 저장소 Settings > Pages > "Source" 를 "GitHub Actions" 로 설정해야 합니다.

# github-pages 환경이 배포를 허용하는 브랜치에서만 실행한다.
# (다른 브랜치에서 실행하면 환경 보호 규칙에 막혀 매번 실패로 기록됨)
on:
  push:
    branches:
      - main
      - claude/epic-carson-1z09cz
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 저장소 루트 전체를 정적 사이트로 업로드
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
