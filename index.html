<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f5f7" />
  <title>교회 소그룹 편성</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="./style.css" />
  <script>
    // 첫 화면이 그려지기 전에 테마를 정해 깜빡임을 막는다.
    // (직접 고른 테마가 없으면 기기 설정을 따른다)
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="brand" id="homeBtn" type="button" aria-label="홈으로">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3" opacity=".7"/><circle cx="8" cy="16" r="3" opacity=".7"/><circle cx="16" cy="16" r="3"/></svg>
        </span>
        <span class="brand-name">소그룹 편성</span>
      </button>
      <button class="icon-btn" id="themeToggle" type="button" aria-label="라이트/다크 모드 전환">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>

    <main id="main">
      <!-- 설정 안내 (Firebase 미설정 시) -->
      <section id="view-setup" class="view">
        <div class="card">
          <h2 class="section-title">Firebase 설정이 필요합니다</h2>
          <p class="muted">
            <code>firebase-config.js</code> 파일에 Firebase 프로젝트 설정을 입력해 주세요.
            자세한 방법은 <code>README.md</code>를 참고하세요.
          </p>
        </div>
      </section>

      <!-- 1) 시작 화면 -->
      <section id="view-home" class="view">
        <div class="hero">
          <div class="hero-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3" opacity=".7"/><circle cx="8" cy="16" r="3" opacity=".7"/><circle cx="16" cy="16" r="3"/></svg>
          </div>
          <h2 class="hero-title">소그룹 편성</h2>
          <p class="hero-sub">남녀 비율을 맞춰 랜덤으로 나눠요</p>
          <div class="hero-actions">
            <button class="btn primary lg" id="goHost" type="button">그룹 만들기</button>
            <button class="btn lg" id="goJoin" type="button">입장하기</button>
          </div>
        </div>
      </section>

      <!-- 2) 참가자 입장 화면 -->
      <section id="view-join" class="view">
        <div class="view-head">
          <h2 class="view-title">방 입장</h2>
          <button class="icon-btn" id="joinClose" type="button" aria-label="닫기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="card">
          <label class="field">
            <span>비밀번호</span>
            <input id="joinCode" type="text" inputmode="numeric" pattern="[0-9]*"
                   maxlength="4" placeholder="••••" autocomplete="off" />
          </label>
          <label class="field">
            <span>이름</span>
            <input id="joinName" type="text" maxlength="20" placeholder="이름" autocomplete="name" />
          </label>
          <div class="field">
            <span>성별</span>
            <div class="gender">
              <label class="radio"><input type="radio" name="gender" value="male" /> 남성</label>
              <label class="radio"><input type="radio" name="gender" value="female" /> 여성</label>
            </div>
          </div>
          <p class="error" id="joinError" role="alert"></p>
          <button class="btn primary lg block" id="doJoin" type="button">입장하기</button>
        </div>
      </section>

      <!-- 3) 사회자 화면 -->
      <section id="view-host" class="view">
        <div class="view-head">
          <h2 class="view-title">방 만들기</h2>
          <button class="icon-btn" id="hostClose" type="button" aria-label="닫기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>

        <div class="code-card">
          <span class="code-label">방 비밀번호</span>
          <div class="code" id="hostCode">----</div>
        </div>

        <div class="card">
          <div class="row between">
            <h3 class="section-title">입장한 사람 <span class="badge" id="hostTotal">0</span></h3>
            <div class="counts">
              <span class="chip male" id="hostMale">남 0</span>
              <span class="chip female" id="hostFemale">여 0</span>
            </div>
          </div>
          <ul class="people" id="hostPeople"></ul>
        </div>

        <div class="card">
          <div class="row between per-group">
            <span class="per-group-label">그룹당 인원</span>
            <div class="stepper">
              <button type="button" class="step-btn" id="perGroupMinus" aria-label="한 명 줄이기">−</button>
              <input id="perGroup" type="number" min="1" value="4" inputmode="numeric" aria-label="그룹당 인원" />
              <button type="button" class="step-btn" id="perGroupPlus" aria-label="한 명 늘리기">+</button>
            </div>
          </div>
          <p class="error" id="hostError" role="alert"></p>
          <div class="actions">
            <button class="btn primary lg block" id="doMakeGroups" type="button">그룹 나누기</button>
            <div class="row-actions">
              <button class="btn" id="goInviteHost" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
                초대하기
              </button>
              <button class="btn" id="showQR" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>
                QR 생성
              </button>
            </div>
          </div>
        </div>

        <div id="hostGroups" class="groups"></div>
      </section>

      <!-- 4) 참가자 대기/결과 화면 -->
      <section id="view-waiting" class="view">
        <div class="view-head">
          <h2 class="view-title">참가자</h2>
          <button class="icon-btn" id="waitClose" type="button" aria-label="닫기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="card">
          <div class="row between">
            <span class="chip who" id="waitWho"></span>
            <div class="counts">
              <span class="chip" id="waitTotal">0명</span>
              <span class="chip male" id="waitMale">남 0</span>
              <span class="chip female" id="waitFemale">여 0</span>
            </div>
          </div>
          <p class="status" id="waitMsg">사회자가 그룹을 나눌 때까지 기다려 주세요…</p>
        </div>

        <div class="card highlight" id="myGroupCard" hidden>
          <h3 class="section-title">내 그룹</h3>
          <div id="myGroup" class="groups"></div>
        </div>

        <div class="card" id="allGroupsCard" hidden>
          <h3 class="section-title">전체 그룹</h3>
          <div id="allGroups" class="groups"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- QR 코드 (사회자 화면) -->
  <dialog id="qrDialog" class="qr-dialog" aria-labelledby="qrTitle">
    <div class="qr-inner">
      <h3 id="qrTitle" class="qr-title">QR코드로 입장</h3>
      <div class="qr-box"><img id="qrImg" alt="방 입장 QR코드" width="220" height="220" /></div>
      <p class="qr-pin">비밀번호 <strong id="qrCode">----</strong></p>
      <button class="btn lg block" id="qrClose" type="button">닫기</button>
    </div>
  </dialog>

  <script src="./vendor/qrcode.js" defer></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
